services:
  kanban-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: kanban-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - kanban-shared-services

  kanban-server-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: kanban-server-dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: development
    networks:
      - kanban-shared-services

volumes:
  node_modules:

networks:
  kanban-shared-services:
    external: true
